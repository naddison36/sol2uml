name: Unit Tests
on: [push]
jobs:
    build:
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                platform: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [22.x, 24.x, 26.x]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.platform }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm install
            - run: npm run build --if-present
            - name: Use system Chrome for Linux PNG tests
              if: runner.os == 'Linux'
              run: |
                  # Ubuntu's AppArmor profile allows the installed Chrome to use its sandbox.
                  test -x /opt/google/chrome/chrome
                  echo "PUPPETEER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
            - run: npm test
              env:
                  DEBUG: sol2uml
                  CI: true
                  SCAN_API_KEY: ${{ secrets.SCAN_API_KEY }}
                  NODE_URL: ${{ secrets.NODE_URL }}
